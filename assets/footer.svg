<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="Rodapé do perfil de Victor Hugo Domingos Bastos">
  <title>Victor Hugo Domingos Bastos — Rodapé</title>
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="footerEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="28%" stop-color="#3B82F6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#3B82F6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="footerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="footerClip">
      <rect x="1" y="1" width="898" height="94" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="900" height="96" fill="url(#footerBg)"/>
    <rect width="900" height="96" fill="url(#footerGrid)"/>
    <rect x="0" y="0" width="900" height="2" fill="url(#footerEdge)"/>

    <g stroke="#334155" stroke-width="1.2" fill="none">
      <path d="M 16 28 V 16 H 28"/>
      <path d="M 884 28 V 16 H 872"/>
      <path d="M 16 68 V 80 H 28"/>
      <path d="M 884 68 V 80 H 872"/>
    </g>

    <g stroke="#2B3544" stroke-width="1.6" fill="none">
      <line x1="42" y1="32" x2="42" y2="64" stroke="#3B82F6"/>
      <line x1="42" y1="48" x2="68" y2="48"/>
      <circle cx="72" cy="48" r="3.5" fill="#22D3EE" stroke="none"/>
    </g>

    <text x="92" y="44" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Victor Hugo Domingos Bastos</text>
    <text x="92" y="66" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12">Lorena, São Paulo · Brasil</text>

    <text x="858" y="44" text-anchor="end" fill="#E2E8F0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12.5" font-weight="500">TI · SOFTWARE · AUTOMAÇÃO INDUSTRIAL</text>
    <text x="858" y="66" text-anchor="end" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12">github.com/domingossss</text>
  </g>

  <rect x="1" y="1" width="898" height="94" rx="12" fill="none" stroke="#2B3544" stroke-width="1.3"/>
