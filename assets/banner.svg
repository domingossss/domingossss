<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Victor Hugo Domingos Bastos — Tecnologia da Informação, Desenvolvimento de Software e Automação Industrial</title>
  <desc id="bannerDesc">Banner técnico escuro com elementos de programação, diagrama Ladder e engenharia industrial.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="subtleGlow" cx="76%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="52%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="318" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Canvas & Blueprint Grid -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#techGrid)"/>
    <rect width="1200" height="320" fill="url(#subtleGlow)"/>

    <!-- Top Technical Accent Bar -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#topEdge)"/>

    <!-- Subtle PCB / Signal Traces -->
    <g fill="none" stroke="#1E293B" stroke-width="1.2">
      <path d="M 0 286 H 196 L 214 268 H 316"/>
      <path d="M 0 296 H 170 L 188 278 H 244"/>
      <path d="M 730 0 V 38 L 752 60 H 812"/>
      <path d="M 1200 264 H 1096 L 1076 284 H 952"/>
    </g>
    <g fill="#3B82F6" opacity="0.55">
      <circle cx="316" cy="268" r="2.5"/>
      <circle cx="244" cy="278" r="2"/>
      <circle cx="812" cy="60" r="2.5"/>
      <circle cx="952" cy="284" r="2"/>
    </g>

    <!-- Corner CAD Registration Marks -->
    <g stroke="#334155" stroke-width="1.2" fill="none">
      <path d="M 22 36 V 22 H 36"/>
      <path d="M 1178 36 V 22 H 1164"/>
      <path d="M 22 284 V 298 H 36"/>
      <path d="M 1178 284 V 298 H 1164"/>
    </g>

    <!-- Left Content Block -->
    <g transform="translate(64, 62)">
      <!-- Status Pill -->
      <rect x="0" y="0" width="298" height="26" rx="13" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1.2">LORENA, SP · BRASIL // DOMINGOSSSS</text>

      <!-- Main Name -->
      <text x="0" y="84" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">Victor Hugo Domingos Bastos</text>

      <!-- Role / Discipline Line -->
      <text x="0" y="120" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
        Tecnologia da Informação
        <tspan fill="#3B82F6" dx="5">/</tspan>
        <tspan dx="5">Desenvolvimento de Software</tspan>
        <tspan fill="#22D3EE" dx="5">/</tspan>
        <tspan dx="5">Automação Industrial</tspan>
      </text>

      <!-- Accent Divider -->
      <rect x="0" y="142" width="108" height="3" rx="1.5" fill="url(#accentLine)"/>

      <!-- Academic & Technical Context -->
      <text x="0" y="176" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">
        FATEC Guaratinguetá · Gestão da Tecnologia da Informação
      </text>
      <text x="0" y="198" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5">
        SENAI Pindamonhangaba · Automação Industrial  |  Técnico em Informática para Internet
      </text>
    </g>

    <!-- Right Engineering Module: Software + Industrial Automation Bridge -->
    <g transform="translate(768, 44)">
      <!-- Module Outer Card -->
      <rect x="0" y="0" width="372" height="232" rx="10" fill="#111827" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2"/>

      <!-- Module Header -->
      <rect x="0" y="0" width="372" height="30" rx="10" fill="#161B22"/>
      <rect x="0" y="20" width="372" height="10" fill="#161B22"/>
      <line x1="0" y1="30" x2="372" y2="30" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="15" r="3.5" fill="#334155"/>
      <circle cx="28" cy="15" r="3.5" fill="#334155"/>
      <circle cx="40" cy="15" r="3.5" fill="#22D3EE" opacity="0.85"/>
      <text x="56" y="19" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="0.8">SYS_BRIDGE :: PLC &lt;-&gt; SOFTWARE</text>

      <!-- Section 1: Ladder Logic Rung -->
      <text x="18" y="50" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5" letter-spacing="1">NETWORK 01 // LADDER LOGIC</text>

      <!-- Power Rails -->
      <line x1="22" y1="62" x2="22" y2="112" stroke="#3B82F6" stroke-width="2"/>
      <line x1="350" y1="62" x2="350" y2="112" stroke="#3B82F6" stroke-width="2"/>

      <!-- Main Rung Base Wire -->
      <path d="M 22 86 H 76 M 92 86 H 152 M 168 86 H 214 M 272 86 H 302 M 322 86 H 350" stroke="#334155" stroke-width="1.6" fill="none"/>

      <!-- Subtle Signal Pulse on Rung -->
      <line x1="22" y1="86" x2="350" y2="86" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="14 340" stroke-linecap="round" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="354" to="0" dur="4.2s" repeatCount="indefinite"/>
      </line>

      <!-- Contact NO: I0.0 -->
      <line x1="76" y1="76" x2="76" y2="96" stroke="#22D3EE" stroke-width="1.8"/>
      <line x1="92" y1="76" x2="92" y2="96" stroke="#22D3EE" stroke-width="1.8"/>
      <text x="84" y="70" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">I0.0</text>

      <!-- Contact NC: I0.1 -->
      <line x1="152" y1="76" x2="152" y2="96" stroke="#3B82F6" stroke-width="1.8"/>
      <line x1="168" y1="76" x2="168" y2="96" stroke="#3B82F6" stroke-width="1.8"/>
      <line x1="154" y1="94" x2="166" y2="78" stroke="#3B82F6" stroke-width="1.4"/>
      <text x="160" y="70" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">I0.1</text>

      <!-- Function Block -->
      <rect x="214" y="72" width="58" height="28" rx="4" fill="#0D1117" stroke="#3B82F6" stroke-width="1.3"/>
      <text x="243" y="89" text-anchor="middle" fill="#F8FAFC" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">PLC_IO</text>

      <!-- Output Coil: Q0.0 -->
      <path d="M 306 76 A 11 11 0 0 0 306 96" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
      <path d="M 318 76 A 11 11 0 0 1 318 96" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
      <text x="312" y="70" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Q0.0</text>

      <!-- Bridge Divider -->
      <line x1="18" y1="126" x2="354" y2="126" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Section 2: Software & Telemetry Readout -->
      <text x="18" y="146" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="9.5" letter-spacing="1">LAYER 02 // SOFTWARE &amp; DATA</text>

      <!-- Code Block Box -->
      <rect x="18" y="156" width="206" height="58" rx="6" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
      <text x="28" y="173" fill="#3B82F6" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">const <tspan fill="#F8FAFC">focus</tspan> = {</text>
      <text x="38" y="188" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">web: <tspan fill="#22D3EE">["TS", "React", "SQL"]</tspan>,</text>
      <text x="38" y="203" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">ind: <tspan fill="#22D3EE">["CLP", "IHM", "TIA"]</tspan> };</text>

      <!-- Frequency / Signal Box -->
      <rect x="234" y="156" width="120" height="58" rx="6" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
      <text x="244" y="171" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">SIGNAL // 60Hz</text>
      <path d="M 244 196 Q 255 174 266 196 T 288 196 T 310 196 T 332 196 T 344 196" fill="none" stroke="#3B82F6" stroke-width="1.6"/>
      <path d="M 244 196 Q 255 182 266 196 T 288 196 T 310 196 T 332 196 T 344 196" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.75"/>
      <line x1="244" y1="196" x2="344" y2="196" stroke="#1E293B" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
