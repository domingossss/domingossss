<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="bannerTitleLight bannerDescLight">
  <title id="bannerTitleLight">Victor Hugo Domingos Bastos — Tecnologia da Informação, Desenvolvimento de Software e Automação Industrial</title>
  <desc id="bannerDescLight">Banner técnico claro estilo blueprint com tipografia ampliada, diagrama Ladder e bloco de software e engenharia industrial.</desc>
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="subtleGlowLight" cx="76%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#0891B2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="topEdgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2563EB" stop-opacity="0.85"/>
      <stop offset="52%" stop-color="#0891B2" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="techGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#CBD5E1" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="frameClipLight">
      <rect x="1" y="1" width="898" height="318" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClipLight)">
    <rect width="900" height="320" fill="url(#bgGradLight)"/>
    <rect width="900" height="320" fill="url(#techGridLight)"/>
    <rect width="900" height="320" fill="url(#subtleGlowLight)"/>
    <rect x="0" y="0" width="900" height="2.5" fill="url(#topEdgeLight)"/>

    <!-- Subtle Corner CAD Marks -->
    <g stroke="#94A3B8" stroke-width="1.4" fill="none">
      <path d="M 18 34 V 18 H 34"/>
      <path d="M 882 34 V 18 H 866"/>
      <path d="M 18 286 V 302 H 34"/>
      <path d="M 882 286 V 302 H 866"/>
    </g>

    <!-- Subtle Bottom PCB Trace -->
    <g fill="none" stroke="#CBD5E1" stroke-width="1.3">
      <path d="M 0 296 H 168 L 184 282 H 264"/>
      <path d="M 900 286 H 806 L 790 300 H 712"/>
    </g>
    <circle cx="264" cy="282" r="2.8" fill="#2563EB" opacity="0.7"/>
    <circle cx="712" cy="300" r="2.4" fill="#0891B2" opacity="0.65"/>

    <!-- Left Content Block -->
    <g transform="translate(42, 34)">
      <rect x="0" y="0" width="318" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
      <circle cx="16" cy="14" r="4.5" fill="#0891B2">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="18.5" fill="#334155" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" letter-spacing="0.9">LORENA, SP · BRASIL // DOMINGOSSSS</text>

      <text x="0" y="84" fill="#0F172A" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.6">Victor Hugo</text>
      <text x="0" y="128" fill="#0F172A" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.6">Domingos Bastos</text>

      <text x="0" y="164" fill="#334155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">
        TI <tspan fill="#2563EB" dx="2">/</tspan> Desenvolvimento de Software <tspan fill="#0891B2" dx="2">/</tspan> Automação Industrial
      </text>

      <rect x="0" y="182" width="118" height="3.5" rx="1.75" fill="url(#accentLineLight)"/>

      <text x="0" y="214" fill="#1E293B" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">FATEC Guaratinguetá · Gestão da Tecnologia da Informação</text>
      <text x="0" y="238" fill="#475569" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14">SENAI Pindamonhangaba · Automação Industrial</text>
    </g>

    <!-- Right Engineering Panel -->
    <g transform="translate(536, 32)">
      <rect x="0" y="0" width="326" height="256" rx="11" fill="#FFFFFF" fill-opacity="0.97" stroke="#CBD5E1" stroke-width="1.3"/>

      <rect x="0" y="0" width="326" height="34" rx="11" fill="#F1F5F9"/>
      <rect x="0" y="22" width="326" height="12" fill="#F1F5F9"/>
      <line x1="0" y1="34" x2="326" y2="34" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#CBD5E1"/>
      <circle cx="32" cy="17" r="4" fill="#CBD5E1"/>
      <circle cx="46" cy="17" r="4" fill="#0891B2"/>
      <text x="64" y="21.5" fill="#334155" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">PLC  &lt;-&gt;  SOFTWARE</text>

      <text x="18" y="56" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.8">NETWORK 01 // LADDER</text>

      <line x1="20" y1="68" x2="20" y2="122" stroke="#2563EB" stroke-width="2.4"/>
      <line x1="306" y1="68" x2="306" y2="122" stroke="#2563EB" stroke-width="2.4"/>

      <path d="M 20 96 H 64 M 84 96 H 126 M 146 96 H 176 M 234 96 H 262 M 286 96 H 306" stroke="#CBD5E1" stroke-width="1.8" fill="none"/>

      <line x1="20" y1="96" x2="306" y2="96" stroke="#0891B2" stroke-width="2" stroke-dasharray="16 290" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="306" to="0" dur="4s" repeatCount="indefinite"/>
      </line>

      <line x1="64" y1="84" x2="64" y2="108" stroke="#0891B2" stroke-width="2.2"/>
      <line x1="84" y1="84" x2="84" y2="108" stroke="#0891B2" stroke-width="2.2"/>
      <text x="74" y="77" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">I0.0</text>

      <line x1="126" y1="84" x2="126" y2="108" stroke="#2563EB" stroke-width="2.2"/>
      <line x1="146" y1="84" x2="146" y2="108" stroke="#2563EB" stroke-width="2.2"/>
      <line x1="129" y1="106" x2="143" y2="86" stroke="#2563EB" stroke-width="1.8"/>
      <text x="136" y="77" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">I0.1</text>

      <rect x="176" y="79" width="58" height="34" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
      <text x="205" y="100" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700">CLP</text>

      <path d="M 267 84 A 13 13 0 0 0 267 108" fill="none" stroke="#0891B2" stroke-width="2.2"/>
      <path d="M 281 84 A 13 13 0 0 1 281 108" fill="none" stroke="#0891B2" stroke-width="2.2"/>
      <text x="274" y="77" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Q0.0</text>

      <line x1="18" y1="136" x2="308" y2="136" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>

      <text x="18" y="158" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.8">LAYER 02 // SOFTWARE &amp; DADOS</text>

      <rect x="18" y="168" width="194" height="70" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
      <text x="28" y="191" fill="#2563EB" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">web: <tspan fill="#0891B2">TS · React · SQL</tspan></text>
      <text x="28" y="213" fill="#2563EB" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">ind: <tspan fill="#0891B2">CLP · IHM · TIA</tspan></text>
      <text x="28" y="230" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">// Indústria 4.0</text>

      <rect x="222" y="168" width="86" height="70" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
      <text x="265" y="185" text-anchor="middle" fill="#475569" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">60 Hz</text>
      <path d="M 230 214 Q 241 190 252 214 T 274 214 T 298 214" fill="none" stroke="#2563EB" stroke-width="2"/>
      <path d="M 230 214 Q 241 199 252 214 T 274 214 T 298 214" fill="none" stroke="#0891B2" stroke-width="1.2"/>
      <line x1="230" y1="214" x2="298" y2="214" stroke="#CBD5E1" stroke-width="1"/>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="318" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
