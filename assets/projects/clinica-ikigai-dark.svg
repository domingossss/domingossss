    <rect x="508" y="150" width="72" height="34" rx="5" fill="#1D4ED8" fill-opacity="0.38" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="518" y="171" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Triagem</text>

    <rect x="268" y="248" width="72" height="36" rx="5" fill="#0891B2" fill-opacity="0.32" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="278" y="270" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Terapia</text>

    <rect x="348" y="248" width="72" height="36" rx="5" fill="#1E293B" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="358" y="270" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Bloqueio</text>

    <rect x="428" y="298" width="72" height="36" rx="5" fill="#0891B2" fill-opacity="0.32" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="438" y="320" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Sessão</text>

    <rect x="508" y="248" width="72" height="58" rx="5" fill="#1D4ED8" fill-opacity="0.38" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="518" y="271" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Retorno</text>
    <text x="518" y="289" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">14:00</text>

    <rect x="588" y="198" width="36" height="36" rx="5" fill="#0891B2" fill-opacity="0.32" stroke="#22D3EE" stroke-width="1.2"/>
    <rect x="588" y="298" width="36" height="36" rx="5" fill="#1D4ED8" fill-opacity="0.38" stroke="#3B82F6" stroke-width="1.2"/>

    <!-- Right Panel: KPIs -->
    <text x="654" y="76" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Indicadores</text>
    <text x="654" y="95" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Painel Chart.js + SSE</text>

    <!-- KPI Card 1 -->
    <rect x="654" y="110" width="206" height="82" rx="9" fill="#111827" stroke="#2B3544" stroke-width="1.1"/>
    <text x="668" y="132" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">OCUPAÇÃO DIÁRIA</text>
    <text x="668" y="160" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700">Snapshots</text>
    <rect x="668" y="172" width="178" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="668" y="172" width="132" height="7" rx="3.5" fill="url(#ikAccent)"/>

    <!-- KPI Chart Card -->
    <rect x="654" y="204" width="206" height="140" rx="9" fill="#111827" stroke="#2B3544" stroke-width="1.1"/>
    <text x="668" y="226" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">ATENDIMENTOS / PERÍODO</text>
    <rect x="672" y="274" width="20" height="38" rx="3" fill="#1E3A8A"/>
    <rect x="702" y="258" width="20" height="54" rx="3" fill="#2563EB"/>
    <rect x="732" y="242" width="20" height="70" rx="3" fill="#3B82F6"/>
    <rect x="762" y="252" width="20" height="60" rx="3" fill="#2563EB"/>
    <rect x="792" y="232" width="20" height="80" rx="3" fill="#22D3EE"/>
    <rect x="822" y="248" width="20" height="64" rx="3" fill="#3B82F6"/>
    <line x1="668" y1="312" x2="846" y2="312" stroke="#334155" stroke-width="1.2"/>
    <text x="668" y="332" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">API Express · SSE Tempo Real</text>

    <!-- Bottom Tech Strip -->
    <rect x="0" y="358" width="880" height="42" fill="#0B0F17"/>
    <line x1="0" y1="358" x2="880" y2="358" stroke="#2B3544" stroke-width="1"/>
    <text x="20" y="384" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5">
      <tspan fill="#22D3EE" font-weight="700">STACK</tspan>  React · TypeScript · Vite · Tailwind CSS · Node.js · Express · MySQL
    </text>
    <text x="860" y="384" text-anchor="end" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">FATEC · PROJETO INTEGRADOR</text>
  </g>

  <rect x="1" y="1" width="878" height="398" rx="14" fill="none" stroke="#2B3544" stroke-width="1.4"/>
</svg>
