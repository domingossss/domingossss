    <text x="24" y="317" fill="#F8FAFC" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">MySQL 8 InnoDB</text>
    <text x="24" y="334" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Transações · Views</text>

