    <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
      <line x1="196" y1="190" x2="634" y2="190"/>
      <line x1="196" y1="240" x2="634" y2="240"/>
      <line x1="196" y1="290" x2="634" y2="290"/>
    </g>
    <g fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">
      <text x="210" y="171">08:00</text>
      <text x="210" y="220">10:30</text>
      <text x="210" y="270">14:00</text>
      <text x="210" y="320">16:30</text>
