    <text x="30" y="196" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Profissionais</text>
    <text x="30" y="226" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Serviços</text>
    <text x="30" y="256" fill="#22D3EE" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">Indicadores KPI</text>

    <!-- DB Card -->
