<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ikigaiTitleDark ikigaiDescDark">
  <title id="ikigaiTitleDark">Prévia visual do sistema Clínica Ikigai</title>
  <desc id="ikigaiDescDark">Mockup de interface em alta legibilidade do sistema web Clínica Ikigai exibindo grade semanal de agendamentos, menu lateral e indicadores gerenciais.</desc>
  <defs>
    <linearGradient id="ikBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ikAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="ikClip">
      <rect x="1" y="1" width="878" height="398" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ikClip)">
    <rect width="880" height="400" fill="url(#ikBg)"/>

    <!-- Window Top Chrome -->
    <rect x="0" y="0" width="880" height="44" fill="#161B22"/>
    <line x1="0" y1="44" x2="880" y2="44" stroke="#2B3544" stroke-width="1"/>
    <circle cx="24" cy="22" r="5" fill="#334155"/>
    <circle cx="42" cy="22" r="5" fill="#334155"/>
    <circle cx="60" cy="22" r="5" fill="#334155"/>

    <!-- Route Bar -->
    <rect x="88" y="10" width="420" height="24" rx="6" fill="#0D1117" stroke="#2B3544" stroke-width="1"/>
    <text x="104" y="26" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5">clinica-ikigai  /agendamentos · /indicadores</text>

    <!-- Architecture Pill -->
    <rect x="678" y="10" width="182" height="24" rx="12" fill="#0D1117" stroke="#2B3544" stroke-width="1"/>
    <circle cx="694" cy="22" r="3.8" fill="#22D3EE"/>
    <text x="706" y="26" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">FULL-STACK · MYSQL 8</text>

    <!-- Left Sidebar -->
    <rect x="0" y="44" width="174" height="314" fill="#111827"/>
    <line x1="174" y1="44" x2="174" y2="358" stroke="#2B3544" stroke-width="1"/>

    <text x="20" y="76" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Clínica Ikigai</text>
    <text x="20" y="94" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">GESTÃO CLÍNICA</text>

    <!-- Active Nav Item -->
    <rect x="14" y="110" width="146" height="32" rx="7" fill="#1E293B" stroke="#3B82F6" stroke-width="1.1"/>
    <rect x="14" y="116" width="3.5" height="20" rx="1.75" fill="#22D3EE"/>
    <text x="30" y="131" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">Agendamentos</text>

    <!-- Other Nav Items -->
