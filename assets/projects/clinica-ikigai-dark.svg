    <rect x="268" y="150" width="72" height="34" rx="5" fill="#1D4ED8" fill-opacity="0.38" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="278" y="171" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Consulta</text>

    <rect x="348" y="150" width="72" height="58" rx="5" fill="#0891B2" fill-opacity="0.32" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="358" y="173" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Sessão</text>
    <text x="358" y="191" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">Confirm.</text>

    <rect x="428" y="198" width="72" height="36" rx="5" fill="#1D4ED8" fill-opacity="0.38" stroke="#3B82F6" stroke-width="1.2"/>
