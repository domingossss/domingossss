    <text x="216" y="131" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">HORA</text>
    <text x="292" y="131" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">SEG</text>
    <text x="372" y="131" fill="#22D3EE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700">TER</text>
    <text x="452" y="131" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">QUA</text>
    <text x="532" y="131" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">QUI</text>
    <text x="598" y="131" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">SEX</text>

