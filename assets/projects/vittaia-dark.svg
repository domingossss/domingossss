<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="vittaiaTitleDark vittaiaDescDark">
  <title id="vittaiaTitleDark">Prévia visual da landing page VITTAIA</title>
  <desc id="vittaiaDescDark">Mockup de navegador em alta legibilidade da landing page responsiva VITTAIA com proposta de marca de refrigerante orgânico de uvaia, consulta ViaCEP e simulação de pedido.</desc>
  <defs>
    <linearGradient id="vtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="vtCan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="55%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="vtAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <clipPath id="vtClip">
      <rect x="1" y="1" width="878" height="398" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#vtClip)">
    <rect width="880" height="400" fill="url(#vtBg)"/>

    <!-- Browser Top Chrome -->
    <rect x="0" y="0" width="880" height="44" fill="#161B22"/>
    <line x1="0" y1="44" x2="880" y2="44" stroke="#2B3544" stroke-width="1"/>
    <circle cx="24" cy="22" r="5" fill="#334155"/>
    <circle cx="42" cy="22" r="5" fill="#334155"/>
    <circle cx="60" cy="22" r="5" fill="#334155"/>

    <!-- URL Bar -->
    <rect x="88" y="10" width="380" height="24" rx="6" fill="#0D1117" stroke="#2B3544" stroke-width="1"/>
    <text x="104" y="26" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5">https://vittaia.vercel.app</text>

    <!-- Live Pill -->
    <rect x="716" y="10" width="144" height="24" rx="12" fill="#0D1117" stroke="#2B3544" stroke-width="1"/>
    <circle cx="732" cy="22" r="3.8" fill="#22D3EE"/>
    <text x="744" y="26" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">DEMO ONLINE</text>

    <!-- Site Nav Bar -->
    <rect x="26" y="58" width="828" height="40" rx="8" fill="#111827" stroke="#2B3544" stroke-width="1"/>
    <text x="46" y="83" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" letter-spacing="2">VITTAIA</text>
    <g fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
      <text x="462" y="83">Produto</text>
      <text x="538" y="83">Festival</text>
      <text x="614" y="83">Distribuição</text>
    </g>
    <rect x="720" y="66" width="118" height="24" rx="12" fill="#3B82F6"/>
    <text x="779" y="82.5" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Simular Pedido</text>

    <!-- Organic Curve Backdrop -->
    <path d="M 26 244 Q 260 218 490 250 T 854 226 L 854 270 L 26 270 Z" fill="#111827" opacity="0.65"/>

    <!-- Hero Left Copy -->
    <g transform="translate(46, 114)">
      <rect x="0" y="0" width="268" height="25" rx="12.5" fill="#14532D" fill-opacity="0.5" stroke="#22C55E" stroke-opacity="0.5" stroke-width="1"/>
      <text x="15" y="16.5" fill="#86EFAC" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="0.5">REFRIGERANTE ORGÂNICO · UVAIA</text>

      <text x="0" y="64" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Diferente até no sabor</text>
      <text x="0" y="92" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5">Landing page responsiva criada para o plano de negócios</text>
      <text x="0" y="112" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5">de Gestão Empresarial (FATEC) · Pack 6x269 ml.</text>

      <rect x="0" y="128" width="146" height="32" rx="7" fill="url(#vtAmber)"/>
      <text x="73" y="149" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Conhecer Pack</text>

      <rect x="158" y="128" width="160" height="32" rx="7" fill="#111827" stroke="#334155" stroke-width="1.2"/>
      <text x="238" y="149" text-anchor="middle" fill="#E2E8F0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500">Consulta ViaCEP</text>
    </g>

    <!-- Hero Right Can Illustration -->
    <g transform="translate(624, 108)">
      <circle cx="102" cy="78" r="72" fill="#14532D" fill-opacity="0.25" stroke="#2B3544" stroke-width="1.2"/>
      <circle cx="102" cy="78" r="58" fill="none" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.1" stroke-dasharray="5 4"/>

      <rect x="66" y="18" width="72" height="124" rx="13" fill="url(#vtCan)" stroke="#22C55E" stroke-opacity="0.65" stroke-width="1.4"/>
      <rect x="74" y="13" width="56" height="7" rx="2.5" fill="#94A3B8"/>
      <rect x="66" y="56" width="72" height="44" fill="#0F172A" fill-opacity="0.6"/>
      <text x="102" y="77" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" letter-spacing="1.4">VITTAIA</text>
      <text x="102" y="92" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">UVAIA 269ml</text>

      <circle cx="148" cy="122" r="12" fill="#F59E0B"/>
      <path d="M 148 110 Q 156 100 164 106" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Feature Cards Row -->
    <g transform="translate(26, 276)">
      <rect x="0" y="0" width="264" height="70" rx="8" fill="#111827" stroke="#2B3544" stroke-width="1.1"/>
      <text x="16" y="22" fill="#22D3EE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">01 // VIACEP API</text>
      <text x="16" y="42" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Simulação de Entrega</text>
      <text x="16" y="59" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Autopreenchimento de endereço</text>

      <rect x="282" y="0" width="264" height="70" rx="8" fill="#111827" stroke="#2B3544" stroke-width="1.1"/>
      <text x="298" y="22" fill="#3B82F6" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">02 // INTERATIVIDADE</text>
      <text x="298" y="42" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Modais e Carrossel</text>
      <text x="298" y="59" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Festival, pedido e acessibilidade</text>

      <rect x="564" y="0" width="264" height="70" rx="8" fill="#111827" stroke="#2B3544" stroke-width="1.1"/>
      <text x="580" y="22" fill="#22D3EE" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">03 // DESEMPENHO</text>
      <text x="580" y="42" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Modo Leve Adaptativo</text>
      <text x="580" y="59" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Bundle esbuild + motion seguro</text>
    </g>

    <!-- Bottom Tech Strip -->
    <rect x="0" y="358" width="880" height="42" fill="#0B0F17"/>
    <line x1="0" y1="358" x2="880" y2="358" stroke="#2B3544" stroke-width="1"/>
    <text x="20" y="384" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5">
      <tspan fill="#22D3EE" font-weight="700">STACK</tspan>  HTML5 · CSS3 · Tailwind CSS 4 · JavaScript ES Modules · esbuild
    </text>
    <text x="860" y="384" text-anchor="end" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">PUBLICADO NA VERCEL</text>
  </g>

  <rect x="1" y="1" width="878" height="398" rx="14" fill="none" stroke="#2B3544" stroke-width="1.4"/>
</svg>
