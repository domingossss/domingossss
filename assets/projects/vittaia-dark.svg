<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="vittaiaTitleDark vittaiaDescDark">
  <title id="vittaiaTitleDark">Prévia visual da landing page VITTAIA</title>
  <desc id="vittaiaDescDark">Mockup de navegador da landing page responsiva VITTAIA exibindo proposta de marca de refrigerante orgânico de uvaia, simulação de pedido e consulta ViaCEP.</desc>
  <defs>
    <linearGradient id="vtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="vtCan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="55%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="vtAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <clipPath id="vtClip">
      <rect x="1" y="1" width="638" height="358" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#vtClip)">
    <rect width="640" height="360" fill="url(#vtBg)"/>

    <!-- Browser Top Chrome -->
    <rect x="0" y="0" width="640" height="36" fill="#161B22"/>
    <line x1="0" y1="36" x2="640" y2="36" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#334155"/>
    <circle cx="34" cy="18" r="4" fill="#334155"/>
    <circle cx="48" cy="18" r="4" fill="#334155"/>

    <!-- URL Bar -->
    <rect x="76" y="8" width="270" height="20" rx="5" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
    <text x="88" y="21.5" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">https://vittaia.vercel.app</text>

    <!-- Live Status Pill -->
    <rect x="514" y="8" width="110" height="20" rx="10" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
    <circle cx="526" cy="18" r="3" fill="#22D3EE"/>
    <text x="536" y="21.5" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">DEMO ONLINE</text>

    <!-- Page Header Inside Preview -->
    <rect x="20" y="48" width="600" height="32" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="36" y="68" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8">VITTAIA</text>
    <g fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">
      <text x="348" y="67">Produto</text>
      <text x="406" y="67">Festival</text>
      <text x="462" y="67">Distribuição</text>
    </g>
    <rect x="536" y="55" width="72" height="18" rx="9" fill="#3B82F6"/>
    <text x="572" y="67" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600">Simular</text>

    <!-- Organic Background Curve -->
    <path d="M 20 222 Q 190 198 356 226 T 620 206 L 620 244 L 20 244 Z" fill="#111827" opacity="0.65"/>

    <!-- Hero Left Copy -->
    <g transform="translate(36, 102)">
      <rect x="0" y="0" width="202" height="20" rx="10" fill="#14532D" fill-opacity="0.45" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="13.5" fill="#86EFAC" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" letter-spacing="0.6">REFRIGERANTE ORGÂNICO · UVAIA</text>

      <text x="0" y="52" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.4">Diferente até no sabor</text>
      <text x="0" y="75" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Landing page responsiva criada para o plano de negócios</text>
      <text x="0" y="91" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">de Gestão Empresarial (FATEC) · Pack 6x269 ml.</text>

      <!-- CTA Buttons -->
      <rect x="0" y="108" width="114" height="26" rx="6" fill="url(#vtAmber)"/>
      <text x="57" y="124.5" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700">Conhecer Pack</text>

      <rect x="124" y="108" width="126" height="26" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="187" y="124.5" text-anchor="middle" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500">Consulta ViaCEP</text>
    </g>

    <!-- Hero Right Visual: Minimalist Stylized Can + Botanical Ring -->
    <g transform="translate(442, 92)">
      <circle cx="84" cy="72" r="64" fill="#14532D" fill-opacity="0.22" stroke="#1E293B" stroke-width="1"/>
      <circle cx="84" cy="72" r="50" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Stylized Beverage Can -->
      <rect x="54" y="20" width="60" height="106" rx="11" fill="url(#vtCan)" stroke="#22C55E" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="61" y="16" width="46" height="6" rx="2" fill="#94A3B8"/>
      <rect x="54" y="54" width="60" height="36" fill="#0F172A" fill-opacity="0.55"/>
      <text x="84" y="71" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2">VITTAIA</text>
      <text x="84" y="83" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="7.5">UVAIA 269ml</text>

      <!-- Small Uvaia Fruit Accent -->
      <circle cx="122" cy="108" r="10" fill="#F59E0B" fill-opacity="0.9"/>
      <path d="M 122 98 Q 129 90 135 95" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Feature Cards Row -->
    <g transform="translate(20, 248)">
      <rect x="0" y="0" width="190" height="62" rx="7" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="20" fill="#22D3EE" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">01 // VIACEP API</text>
      <text x="12" y="37" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">Simulação de Entrega</text>
      <text x="12" y="51" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5">Autopreenchimento de endereço</text>

      <rect x="205" y="0" width="190" height="62" rx="7" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="217" y="20" fill="#3B82F6" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">02 // INTERATIVIDADE</text>
      <text x="217" y="37" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">Modais &amp; Carrossel</text>
      <text x="217" y="51" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5">Festival, pedido e acessibilidade</text>

      <rect x="410" y="0" width="190" height="62" rx="7" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="422" y="20" fill="#22D3EE" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">03 // DESEMPENHO</text>
      <text x="422" y="37" fill="#F8FAFC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">Modo Leve Adaptativo</text>
      <text x="422" y="51" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5">Bundle esbuild + motion seguro</text>
    </g>

    <!-- Bottom Tech Strip -->
    <rect x="0" y="324" width="640" height="36" fill="#0B0F17"/>
    <line x1="0" y1="324" x2="640" y2="324" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="346" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">
      <tspan fill="#22D3EE">STACK</tspan>  HTML5 · CSS3 · Tailwind CSS 4 · JavaScript ES Modules · esbuild
    </text>
    <text x="624" y="346" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">VERCEL</text>
  </g>

  <rect x="1" y="1" width="638" height="358" rx="12" fill="none" stroke="#1E293B" stroke-width="1.2"/>
</svg>
