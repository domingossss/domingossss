      <text x="580" y="22" fill="#0891B2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">03 // DESEMPENHO</text>
      <text x="580" y="42" fill="#0F172A" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Modo Leve Adaptativo</text>
