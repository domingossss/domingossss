<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="vittaiaTitleLight vittaiaDescLight">
  <title id="vittaiaTitleLight">Prévia visual da landing page VITTAIA</title>
  <desc id="vittaiaDescLight">Mockup de navegador claro em alta legibilidade da landing page responsiva VITTAIA com proposta de marca de refrigerante orgânico de uvaia, consulta ViaCEP e simulação de pedido.</desc>
  <defs>
